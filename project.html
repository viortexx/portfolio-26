<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | Vitoria Coelho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header>
    <div class="social-icons">
      <a href="https://www.linkedin.com/in/vitoriacoelho" target="_blank" class="interactive">
        <img src="./ASSETS/VECTORS/icon_linkedin.svg" alt="LinkedIn">
      </a>
      <a href="mailto:vitoria.rcoelho@gmail.com" class="interactive">
        <img src="./ASSETS/VECTORS/icon_email.svg" alt="Email">
      </a>
      <a href="https://wa.me/5511913074747" target="_blank" class="interactive">
        <img src="./ASSETS/VECTORS/icon_message.svg" alt="Chat">
      </a>
    </div>
    <a href="projects.html" class="logo">
      <img src="./ASSETS/IMAGES/logo site.png" alt="Vitoria Coelho Logo">
    </a>
    <nav>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <section class="project-page-section">
      
      <h1 id="project-title" class="project-main-title">Projeto 1</h1>
      
      <div class="project-info-layout">
        <!-- Left Box -->
        <div class="project-details-box">
          <div class="details-content" id="project-credits">
            <!-- Populated via JS -->
          </div>
        </div>
        
        <!-- Right Box -->
        <div class="project-browser-box">
          <div class="browser-content">
            <p id="project-description"><!-- Populated via JS --></p>
          </div>
        </div>
      </div>

      <div class="project-media-grid" id="project-media-grid">
        <!-- Populated via JS -->
      </div>

    </section>
    
    <div style="text-align: center; padding: 2rem 0; margin-top: 2rem;">
      <img src="./ASSETS/VECTORS/SVG_Star.svg" alt="Star Footer" style="height: 60px;">
    </div>
  </main>

  <script src="projectsData.js"></script>
  <script src="main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');

    if (projectId && typeof projectsData !== 'undefined' && projectsData[projectId]) {
      const data = projectsData[projectId];
      
      // Update Title
      const titleEl = document.getElementById('project-title');
      if (titleEl) titleEl.textContent = data.title;
      
      // Update Description
      const descEl = document.getElementById('project-description');
      if (descEl) descEl.textContent = data.description;
      
      // Update Credits
      const creditsEl = document.getElementById('project-credits');
      if (creditsEl && data.credits) {
        creditsEl.innerHTML = '';
        data.credits.forEach(credit => {
          const p = document.createElement('p');
          p.innerHTML = `<strong>${credit.label}:</strong> ${credit.value}`;
          creditsEl.appendChild(p);
        });
      }

      // Update Media Grid
      const mediaGridEl = document.getElementById('project-media-grid');
      if (mediaGridEl && data.media) {
        mediaGridEl.innerHTML = '';
        if (data.layout) {
          mediaGridEl.classList.add(`layout-${data.layout}`);
        }
        data.media.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'media-item interactive';
          
          if (index === 0 && (!data.layout || (!data.layout.includes('2x2') && !data.layout.includes('hero-left')))) {
            div.classList.add('full-width');
          }

          if (item.type === 'video' && item.src) {
            let videoAttrs = 'controls';
            if (data.layout && data.layout.includes('autoplay')) {
              videoAttrs = 'autoplay muted loop playsinline';
            }
            div.innerHTML = `
              <video ${videoAttrs} style="width: 100%; height: 100%; object-fit: cover;">
                <source src="${item.src}" type="video/mp4">
              </video>
            `;
          } else if (item.type === 'image' && item.src) {
            div.innerHTML = `<img src="${item.src}" alt="${data.title}" style="width: 100%; height: 100%; object-fit: cover;">`;
          } else {
            // Placeholder
            div.style.background = '#D9D9D9';
          }
          mediaGridEl.appendChild(div);
        });
      }
    } else if (projectId) {
      // Fallback if data not in projectsData.js yet
      let formattedTitle = projectId.replace(/-/g, ' ');
      formattedTitle = formattedTitle.charAt(0).toUpperCase() + formattedTitle.slice(1);
      
      const titleEl = document.getElementById('project-title');
      if (titleEl) titleEl.textContent = formattedTitle;
    }
  </script>
</body>
</html>
